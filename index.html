
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#c8e6e8">
<title>Hope — The World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#c8e6e8;color:white}
button,input{font:inherit}
#world{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:fixed;z-index:3;top:12px;left:18px;padding-top:12px;font-weight:850;letter-spacing:.04em;text-shadow:0 2px 12px #315b6b88}
.brand b{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:7px;border-radius:10px;background:#ffffff55}
.tag{position:fixed;z-index:3;right:16px;top:24px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;border:1px solid #ffffff88;border-radius:30px;background:#ffffff35;backdrop-filter:blur(10px)}
.panel{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:84dvh;overflow:auto;padding:25px;border:1px solid #ffffff99;border-radius:26px;background:linear-gradient(145deg,#fffdf0ed,#e9f4f0e8);color:#456267;box-shadow:0 22px 80px #315b6b35;backdrop-filter:blur(16px);text-align:center}
.eyebrow{font-size:10px;font-weight:850;letter-spacing:.2em;color:#8d83a4;margin:0 0 8px}
.panel h1{font:500 clamp(34px,8vw,49px)/1 Georgia,serif;color:#49666a;margin:0 0 8px}
.sub{font-size:13px;color:#71878a;margin:0 0 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.choice{border:2px solid #dce8e2;border-radius:18px;background:#ffffffa8;padding:12px 8px;color:#526b6d;cursor:pointer;transition:.2s}
.choice.selected{border-color:#9b82bd;background:#f4effb;box-shadow:0 0 0 3px #a58ac522}
.avatar{height:112px;display:grid;place-items:center}
.avatar svg{height:112px;width:100%}
.choice strong{display:block;font-size:14px}
.choice small{font-size:10px;color:#829497}
.field{text-align:left;margin:14px 0}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;margin:0 0 6px;color:#647d7e}
.field input{width:100%;border:1px solid #d7e4df;border-radius:12px;background:white;padding:13px 14px;outline:none;color:#435e62}
.field input:focus{border-color:#9b82bd;box-shadow:0 0 0 3px #a58ac522}
.primary{width:100%;border:0;border-radius:30px;padding:14px 18px;background:linear-gradient(100deg,#8972ae,#739e9b);color:white;font-weight:800;cursor:pointer;box-shadow:0 8px 20px #758e9a44}
.tiny{font-size:10px;color:#8b9b9b;margin:12px 0 0}
.hidden{display:none!important}
.hud{position:fixed;z-index:3;left:16px;top:60px;padding:9px 13px;border:1px solid #ffffff70;border-radius:14px;background:#ffffff35;backdrop-filter:blur(9px);font-size:12px}
.help{position:fixed;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;font-size:10px;padding:9px 13px;border-radius:30px;background:#ffffff45;border:1px solid #ffffff70}
.stick{position:fixed;z-index:3;left:22px;bottom:28px;width:112px;height:112px;border-radius:50%;background:#ffffff38;border:1px solid #ffffff80;touch-action:none;display:none}
.knob{position:absolute;left:50%;top:50%;width:43px;height:43px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffffbb;box-shadow:0 3px 12px #355b5b44}
.lookhint{position:fixed;right:20px;bottom:48px;font-size:10px;display:none}
@media(max-width:650px){
.panel{padding:21px 17px}
.avatar,.avatar svg{height:95px}
.stick{display:block}
.lookhint{display:block}
.help{bottom:150px;font-size:9px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="world"></div>
<div class="brand"><b>✦</b>Hope</div>
<div class="tag">A new world begins</div>

<section class="panel" id="welcome">
<p class="eyebrow">A LITTLE PLACE TO BELONG</p>
<h1>Welcome to Hope</h1>
<p class="sub">Create your character. Your world is waiting.</p>

<div class="choices">
<button class="choice selected" data-kind="girl">
<div class="avatar">
<svg viewBox="0 0 120 120">
<ellipse cx="60" cy="108" rx="28" ry="6" fill="#d5e1dc"/>
<path d="M34 109Q35 75 60 72Q85 75 86 109Z" fill="#bd91c9"/>
<path d="M38 42Q35 10 62 12Q91 13 84 53L78 74H42Z" fill="#60483e"/>
<circle cx="60" cy="47" r="24" fill="#f0c5a5"/>
<path d="M36 42Q36 10 62 12Q88 12 85 45Q75 28 57 28Q47 40 36 42" fill="#60483e"/>
<circle cx="51" cy="48" r="2" fill="#493d3a"/>
<circle cx="69" cy="48" r="2" fill="#493d3a"/>
<path d="M54 59Q60 64 66 59" stroke="#b76f76" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M47 77L60 88L73 77" fill="#f6e9ef"/>
</svg>
</div>
<strong>Girl</strong><small>Soft & sunny</small>
</button>

<button class="choice" data-kind="boy">
<div class="avatar">
<svg viewBox="0 0 120 120">
<ellipse cx="60" cy="108" rx="28" ry="6" fill="#d5e1dc"/>
<path d="M34 109Q35 75 60 72Q85 75 86 109Z" fill="#83a9c5"/>
<circle cx="60" cy="47" r="24" fill="#e9bc99"/>
<path d="M36 43Q36 13 62 13Q87 13 84 44Q74 29 59 29Q47 38 36 43" fill="#59463d"/>
<circle cx="51" cy="48" r="2" fill="#493d3a"/>
<circle cx="69" cy="48" r="2" fill="#493d3a"/>
<path d="M54 59Q60 63 66 59" stroke="#ad6d69" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M47 77L60 88L73 77" fill="#eaf3f5"/>
</svg>
</div>
<strong>Boy</strong><small>Calm & curious</small>
</button>
</div>

<div class="field">
<label for="playerName">YOUR NAME</label>
<input id="playerName" maxlength="16" placeholder="Choose a name" autocomplete="nickname">
</div>
<button class="primary" id="enter">Create character & enter world</button>
<p class="tiny">You can change your look later. This is your beginning.</p>
</section>

<div id="hud" class="hud hidden">Welcome, <b id="hudName">Friend</b> ✦</div>
<div id="help" class="help hidden">Move: WASD / arrow keys · Drag to look</div>
<div id="stick" class="stick hidden"><div class="knob" id="knob"></div></div>
<div id="lookhint" class="lookhint">Drag the world to look around</div>

<script type="module">
import * as THREE from 'three';

const host=document.querySelector('#world');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb9dce8);
scene.fog=new THREE.Fog(0xb9dce8,35,105);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'default'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
host.appendChild(renderer.domElement);

function resize(){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
resize();

scene.add(new THREE.HemisphereLight(0xeaf8ff,0x718b55,2));
const sun=new THREE.DirectionalLight(0xffedcf,2.3);
sun.position.set(-12,22,10);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});
function add(g,m,x,y,z,sx=1,sy=1,sz=1){
const o=new THREE.Mesh(g,m);
o.position.set(x,y,z);
o.scale.set(sx,sy,sz);
o.castShadow=true;
o.receiveShadow=true;
scene.add(o);
return o;
}

add(new THREE.PlaneGeometry(180,180),mat(0x83ad63),0,-.12,0).rotation.x=-Math.PI/2;

const stone=mat(0xd3c5a7);
for(let i=0;i<32;i++){
const z=18-i*1.25,x=Math.sin(i*.19)*1.8;
const p=add(new THREE.BoxGeometry(2.7,.12,1),stone,x,.01,z);
p.rotation.y=-Math.sin(i*.19)*.12;
}

const trunk=mat(0x795b43);
const leaves=[0x4f8054,0x63965d,0x7da96b].map(mat);
[[-17,-11],[-14,-20],[-6,-24],[4,-26],[13,-20],[19,-12],[22,-2],[-21,3],[16,8],[-15,11],[8,-14]].forEach(([x,z],i)=>{
add(new THREE.CylinderGeometry(.22,.34,2.6,7),trunk,x,1.3,z);
add(new THREE.SphereGeometry(1.6,10,8),leaves[i%3],x,3,z,1,1.1,1);
add(new THREE.SphereGeometry(1.1,10,8),leaves[i%3],x+.7,3.6,z);
});

const roof=mat(0x9c7896);
const cream=mat(0xf3e9d8);
const gx=-9,gz=-5;
add(new THREE.CylinderGeometry(3.5,3.8,.25,8),mat(0xd5b99a),gx,.35,gz);
for(let i=0;i<8;i++){
const a=i*Math.PI/4;
add(new THREE.CylinderGeometry(.11,.13,3.5,8),cream,gx+Math.cos(a)*2.7,2.3,gz+Math.sin(a)*2.7);
}
const cap=add(new THREE.ConeGeometry(4,1.7,8),roof,gx,4.8,gz);
cap.rotation.y=Math.PI/8;

const flowerM=[0xf0a8c9,0xf3d27d,0xb9a2e8,0xffffff].map(mat);
for(let i=0;i<95;i++){
const a=i*2.399,r=5+(i%14)*1.1;
const x=Math.cos(a)*r,z=Math.sin(a)*r*.7+1;
if(Math.abs(x)<2&&z>0)continue;
add(new THREE.CylinderGeometry(.025,.035,.38,5),mat(0x477c4b),x,.19,z);
add(new THREE.SphereGeometry(.14,7,6),flowerM[i%4],x,.42,z,.9,.7,.9);
}

const cloudmat=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.8});
for(let i=0;i<7;i++){
for(let j=0;j<4;j++){
add(new THREE.SphereGeometry(1.5,9,7),cloudmat,-28+i*10+j*1.5,13+(i%3)*1.5,-35-(i%2)*7,1.3,.7,1);
}
}

let avatar,kind='girl',playing=false,playerName='Friend',yaw=0,drag=false,lastX=0;
const keys={};
const skin=mat(0xf0c5a5),hair=mat(0x60483e);
const shirtGirl=mat(0xbd91c9),shirtBoy=mat(0x83a9c5);
const pants=mat(0x53677a),shoe=mat(0xf3e9d8);

function makeAvatar(type){
if(avatar)scene.remove(avatar);
avatar=new THREE.Group();
const shirt=type==='girl'?shirtGirl:shirtBoy;
function part(g,m,x,y,z,sx=1,sy=1,sz=1){
const o=new THREE.Mesh(g,m);
o.position.set(x,y,z);
o.scale.set(sx,sy,sz);
o.castShadow=true;
avatar.add(o);
}
part(new THREE.CylinderGeometry(.36,.43,.85,12),shirt,0,1.15,0);
part(new THREE.SphereGeometry(.32,16,12),skin,0,1.88,0,1,.95,.9);
part(new THREE.SphereGeometry(.34,12,9),hair,0,2.05,-.07,1,.65,1);
part(new THREE.BoxGeometry(.18,.58,.2),shirt,-.48,1.2,0,.8,1,1);
part(new THREE.BoxGeometry(.18,.58,.2),shirt,.48,1.2,0,.8,1,1);
for(const x of [-.19,.19]){
part(new THREE.CylinderGeometry(.12,.14,.65,9),pants,x,.48,0);
part(new THREE.BoxGeometry(.25,.14,.42),shoe,x,.12,.08);
}
scene.add(avatar);
}
makeAvatar('girl');

const welcome=document.querySelector('#welcome');
const choices=[...document.querySelectorAll('.choice')];
choices.forEach(b=>b.addEventListener('click',()=>{
kind=b.dataset.kind;
choices.forEach(c=>c.classList.toggle('selected',c===b));
makeAvatar(kind);
}));

document.querySelector('#enter').addEventListener('click',()=>{
playerName=document.querySelector('#playerName').value.trim().slice(0,16)||'Friend';
document.querySelector('#hudName').textContent=playerName;
welcome.classList.add('hidden');
document.querySelector('#hud').classList.remove('hidden');
document.querySelector('#help').classList.remove('hidden');
document.querySelector('#stick').classList.remove('hidden');
document.querySelector('#lookhint').classList.remove('hidden');
playing=true;
});

function cameraUpdate(){
const d=playing?8:13;
const focus=playing?new THREE.Vector3(avatar.position.x,1.1,avatar.position.z):new THREE.Vector3(0,1,0);
camera.position.set(focus.x+Math.sin(yaw)*d,focus.y+5,focus.z+Math.cos(yaw)*d);
camera.lookAt(focus);
}

renderer.domElement.addEventListener('pointerdown',e=>{
drag=true;lastX=e.clientX;
renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
if(!drag)return;
const dx=e.clientX-lastX;
lastX=e.clientX;
yaw-=dx*.005;
});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointercancel',()=>drag=false);

const stick=document.querySelector('#stick');
const knob=document.querySelector('#knob');
let joyX=0,joyY=0,stickOn=false;
stick.addEventListener('pointerdown',e=>{
stickOn=true;
stick.setPointerCapture(e.pointerId);
moveStick(e);
});
stick.addEventListener('pointermove',e=>{
if(stickOn)moveStick(e);
});
function moveStick(e){
const r=stick.getBoundingClientRect();
const cx=r.left+r.width/2,cy=r.top+r.height/2;
const dx=e.clientX-cx,dy=e.clientY-cy;
const len=Math.hypot(dx,dy),max=34,k=Math.min(1,max/(len||1));
joyX=dx*k/max;
joyY=dy*k/max;
knob.style.left=`${50+joyX*38}%`;
knob.style.top=`${50+joyY*38}%`;
}
function resetStick(){
stickOn=false;joyX=joyY=0;
knob.style.left='50%';knob.style.top='50%';
}
stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

let prev=0;
function animate(t){
requestAnimationFrame(animate);
const dt=Math.min((t-prev)/1000||0,.04);
prev=t;
if(playing){
let x=joyX,z=joyY;
if(keys.w||keys.arrowup)z-=1;
if(keys.s||keys.arrowdown)z+=1;
if(keys.a||keys.arrowleft)x-=1;
if(keys.d||keys.arrowright)x+=1;
const len=Math.hypot(x,z);
if(len>.05){
x/=Math.max(1,len);z/=Math.max(1,len);
const fx=Math.cos(yaw)*x+Math.sin(yaw)*z;
const fz=-Math.sin(yaw)*x+Math.cos(yaw)*z;
avatar.position.x+=fx*5*dt;
avatar.position.z+=fz*5*dt;
avatar.position.x=THREE.MathUtils.clamp(avatar.position.x,-35,35);
avatar.position.z=THREE.MathUtils.clamp(avatar.position.z,-35,25);
avatar.rotation.y=Math.atan2(fx,fz);
}
}
cameraUpdate();
renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
