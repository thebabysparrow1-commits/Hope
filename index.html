<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The World</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8c4;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#cfe8c4;color:#2f4f2f;z-index:10;text-align:center;padding:16px;font-size:20px}
#status{margin-top:8px;font-size:14px;opacity:.8}
#errbox{display:none;position:fixed;left:8px;right:8px;bottom:8px;max-height:45%;overflow:auto;background:#300;color:#fff;font:12px monospace;padding:10px;border-radius:8px;z-index:20;white-space:pre-wrap}
#ver{position:fixed;top:6px;left:8px;font-size:11px;color:#2f4f2f;opacity:.7;z-index:5}
</style>
</head>
<body>
<div id="ver">The World v0.1 (step 1: scene)</div>
<div id="loading"><div>Creating your world…</div><div id="status">Starting…</div></div>
<div id="errbox"></div>

<script>
// Classic script: runs first, so it can catch anything that goes wrong later.
function showError(msg){
  var b=document.getElementById('errbox');
  b.style.display='block';
  b.textContent+=msg+'\n\n';
  var s=document.getElementById('status');
  if(s) s.textContent='Something went wrong (see red box)';
}
window.addEventListener('error',function(e){showError('ERROR: '+e.message+' ('+(e.filename||'')+':'+(e.lineno||'')+')');});
window.addEventListener('unhandledrejection',function(e){showError('PROMISE ERROR: '+(e.reason&&e.reason.message?e.reason.message:e.reason));});
</script>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
const setStatus = t => { document.getElementById('status').textContent = t; };

try {
  setStatus('1/5 Loading 3D engine…');
  const THREE = await import('three');

  setStatus('2/5 Checking graphics…');
  const test = document.createElement('canvas');
  if (!(test.getContext('webgl2') || test.getContext('webgl'))) throw new Error('WebGL is not available on this device/browser.');

  setStatus('3/5 Creating renderer…');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  setStatus('4/5 Building meadow…');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd3f5);
  scene.fog = new THREE.Fog(0x9fd3f5, 40, 140);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa66, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(30, 50, 20);
  scene.add(sun);

  // Ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x6fbf5a }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Path
  const path = new THREE.Mesh(new THREE.PlaneGeometry(4, 60), new THREE.MeshLambertMaterial({ color: 0xd9c8a0 }));
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.02;
  scene.add(path);

  // Trees (simple, fixed positions so every player sees the same world)
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x2f8f3f });
  for (let i = 0; i < 24; i++) {
    const a = i * 2.399963; // golden angle spread
    const r = 14 + (i % 6) * 5;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.abs(x) < 4) continue; // keep the path clear
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 8), trunkMat);
    trunk.position.set(x, 1, z);
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.8, 4.5, 8), leafMat);
    leaves.position.set(x, 4, z);
    scene.add(trunk, leaves);
  }

  // Placeholder marker so we can see the render loop is alive (replaced by avatars later)
  const marker = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xff7aa8 }));
  marker.position.set(0, 0.5, 0);
  scene.add(marker);

  // Camera orbit: drag to rotate, wheel / pinch to zoom
  let yaw = 0, pitch = 0.45, dist = 10;
  const target = new THREE.Vector3(0, 1.5, 0);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function placeCamera() {
    camera.position.set(
      target.x + Math.sin(yaw) * Math.cos(pitch) * dist,
      target.y + Math.sin(pitch) * dist,
      target.z + Math.cos(yaw) * Math.cos(pitch) * dist
    );
    camera.lookAt(target);
  }

  const pointers = new Map();
  let pinchStart = 0, distStart = 0;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
      distStart = dist;
    }
  });
  el.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    if (pointers.size === 1) {
      yaw -= (e.clientX - p.x) * 0.006;
      pitch = clamp(pitch + (e.clientY - p.y) * 0.006, 0.1, 1.3);
    }
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchStart > 0) dist = clamp(distStart * (pinchStart / d), 4, 25);
    }
  });
  const endPointer = e => { pointers.delete(e.pointerId); };
  el.addEventListener('pointerup', endPointer);
  el.addEventListener('pointercancel', endPointer);
  el.addEventListener('wheel', e => { dist = clamp(dist + e.deltaY * 0.01, 4, 25); e.preventDefault(); }, { passive: false });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setStatus('5/5 Starting…');
  let first = true;
  renderer.setAnimationLoop(() => {
    marker.rotation.y += 0.01;
    placeCamera();
    renderer.render(scene, camera);
    if (first) { first = false; document.getElementById('loading').style.display = 'none'; }
  });
} catch (err) {
  showError('STARTUP FAILED: ' + (err && err.message ? err.message : err));
}
</script>
</body>
</html>
